<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Operator Input</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f2f7);--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--btn:var(--tg-theme-button-color,#2481cc);--btntext:var(--tg-theme-button-text-color,#fff);--ok:#22a06b;--warn:#e67e00;--bad:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;padding:8px 14px calc(8px + env(safe-area-inset-bottom));gap:7px}
.head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;min-height:48px}.head button{border:0;background:none;color:var(--btn);font-weight:700;padding:5px 3px;font-size:14px}.head .cancel{color:var(--bad)}
.title{text-align:center;font-weight:800;font-size:16px}.sub{text-align:center;color:var(--hint);font-size:11px;margin-top:1px}
.progress{height:4px;background:var(--card);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:var(--btn);transition:.2s}
.meta{background:var(--card);border-radius:14px;padding:9px 11px;font-size:11px;color:var(--hint);display:flex;flex-wrap:wrap;gap:5px 10px}.meta b{color:var(--text)}
.card{background:var(--card);border-radius:16px;padding:11px 14px}.label{font-size:17px;font-weight:800;line-height:1.18}.unit{font-size:11px;color:var(--hint);margin-top:3px}.std{font-size:10px;margin-top:5px}.state{font-size:11px;font-weight:700;min-height:14px;margin-top:3px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.display{height:68px;flex:none;background:var(--card);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;letter-spacing:.5px}.empty{color:var(--hint);font-weight:500}
.keys{flex:none;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,56px);gap:9px}.key{border:0;border-radius:16px;background:var(--card);color:var(--text);font-size:27px;font-weight:650}.key:active{transform:scale(.97);opacity:.75}.key.small{font-size:18px}.key.wide{grid-column:span 3}
.note{text-align:center;color:var(--hint);font-size:10px;line-height:13px;min-height:13px}
.review{display:none;flex:1;min-height:0;overflow:auto}.review.show{display:block}.list{background:var(--card);border-radius:16px;padding:0 12px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.18)}.row:last-child{border:0}.name{min-width:0}.name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.name span{font-size:10px;color:var(--hint)}.val{font-weight:800}.badge{font-size:10px;font-weight:800;min-width:45px;text-align:right}.ready{color:var(--ok)}.check{color:var(--warn)}.missing{color:var(--bad)}

.parameter-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;min-height:92px}
.param-main{min-width:0}.param-person{text-align:right;border-left:1px solid rgba(128,128,128,.18);padding-left:12px;min-width:82px;max-width:135px}
.operator-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.operator-shift{font-size:10px;color:var(--hint);margin-top:3px;white-space:nowrap}
.nav-buttons{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:0}
.nav-btn{height:44px;border:0;border-radius:15px;font-size:14px;font-weight:800}
.nav-btn.prev{background:var(--card);color:var(--text)}
.nav-btn.next{background:var(--btn);color:var(--btntext)}
.nav-btn:active{transform:scale(.98);opacity:.82}

/* Compact phones: keep every control visible without giant stretched keypad rows. */
@media (max-height:700px){
  .app{gap:5px;padding-top:5px}
  .head{min-height:42px}
  .parameter-card{min-height:82px}
  .display{height:58px}
  .keys{grid-template-rows:repeat(5,50px);gap:7px}
  .key{border-radius:14px;font-size:25px}
  .nav-btn{height:40px}
}
@media (min-height:850px){
  .keys{grid-template-rows:repeat(5,58px)}
}

/* FINAL SPACING FIX: keypad has exactly five rows, including Hapus. */
.keys{grid-template-rows:repeat(5,56px)!important;grid-auto-rows:56px!important;align-content:start!important}
.key{height:56px!important;min-height:0!important}
.key.wide{height:56px!important}
@media (max-height:700px){
  .keys{grid-template-rows:repeat(5,50px)!important;grid-auto-rows:50px!important}
  .key,.key.wide{height:50px!important}
}
</style>
<!-- UI layout: proportional compact operator keypad; functional JS intentionally preserved. -->
</head>
<body>
<div class="app">
  <div class="head"><button class="cancel" id="cancel">❌ Batal</button><div><div class="title" id="title">Input Operator</div><div class="sub" id="sub">1 / 1</div></div><button id="reviewBtn">📋 Ringkas</button></div>
  <div class="progress"><i id="bar"></i></div>
  <section id="entry">
    <div class="card parameter-card">
  <div class="param-main">
    <div class="label" id="label">Nilai</div>
    <div class="unit" id="unit"></div>
    <div class="std" id="std"></div>
    <div class="state" id="state"></div>
  </div>
  <div class="param-person">
    <div class="operator-name" id="operatorName">-</div>
    <div class="operator-shift" id="operatorShift">Shift -</div>
  </div>
</div>
    <div class="display empty" id="display">0</div>
    <div class="keys">
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key small" data-k="sign">±</button><button class="key" data-k="0">0</button><button class="key small" data-k="dot">,</button>
      <button class="key small wide" data-k="back">⌫ Hapus</button>
    </div>
    <div class="note" id="note"></div>
    <div class="nav-buttons">
      <button type="button" class="nav-btn prev" id="prevBtn">‹ Kembali</button>
      <button type="button" class="nav-btn next" id="nextBtn">Lanjut ›</button>
    </div>
  </section>

  <section class="review" id="review"><div class="list" id="list"></div></section>
</div>
<script>
(()=>{"use strict";
const tg=window.Telegram?.WebApp||null, qs=new URLSearchParams(location.search);
const parse=(s,f)=>{try{return JSON.parse(s||"")||f}catch(e){return f}};
let params=parse(qs.get("params"),[]), meta=parse(qs.get("meta"),{});
params=Array.isArray(params)?params.map(p=>({key:String(p.key||""),label:String(p.label||p.key||"Nilai"),satuan:String(p.satuan||"")})).filter(p=>p.key):[];
if(!params.length)params=[{key:"nilai",label:"Nilai",satuan:""}];

let i=0,vals=params.map(()=>""),neg=params.map(()=>false),review=false;
const $=id=>document.getElementById(id);
const display=$("display"),label=$("label"),unit=$("unit"),std=$("std"),state=$("state");
const title=$("title"),sub=$("sub"),bar=$("bar"),note=$("note");
const op=$("operatorName"),sh=$("operatorShift"),prev=$("prevBtn"),nextBtn=$("nextBtn");
if(op)op.textContent=meta.nama_operator||meta.operator||"-";
if(sh)sh.textContent=meta.shift?("Shift "+String(meta.shift).replace(/^Shift\s*/i,"")):"Shift -";
if(tg){tg.ready();tg.expand();try{tg.BackButton.show()}catch(e){}}

function h(type="light"){try{tg?.HapticFeedback?.impactOccurred(type)}catch(e){}}
function num(j=i){if(!vals[j])return null;const x=parseFloat((neg[j]?"-":"")+vals[j]);return Number.isFinite(x)?x:null}
function textValue(j=i){return vals[j]?(neg[j]?"-":"")+vals[j]:""}
function render(){
 if(review)return;
 const p=params[i], n=num();
 label.textContent=p.label;
 unit.textContent=p.satuan?"Satuan: "+p.satuan:"";
 std.textContent="";
 state.textContent=n===null?"":"✓ Nilai terisi";
 state.className="state"+(n===null?"":" ok");
 sub.textContent=(i+1)+" / "+params.length;
 bar.style.width=((i+1)/params.length*100)+"%";
 display.textContent=textValue(i)||"0";
 display.classList.toggle("empty",!vals[i]);
 prev.disabled=i===0;
 prev.style.opacity=i===0?".45":"1";
 nextBtn.textContent=i===params.length-1?"Review & Kirim":"Lanjut ›";
 note.textContent=params.length>1?"Nilai tersimpan saat berpindah parameter.":"Periksa nilai sebelum dikirim.";
}
function goNext(){
 if(num()===null){state.className="state bad";state.textContent="❌ Nilai belum diisi";h("rigid");return}
 if(i<params.length-1){i++;render()}else showReview(true);
}
function goBack(){
 if(review){showReview(false);return}
 if(i>0){i--;render()}else h("light");
}
function showReview(on){
 review=on;
 $("entry").style.display=on?"none":"block";
 $("review").classList.toggle("show",on);
 title.textContent=on?"Periksa Laporan":"Input Operator";
 $("reviewBtn").textContent=on?"✏️ Edit":"📋 Ringkas";
 if(tg?.MainButton){
   tg.MainButton.setText(on?"✅ Kirim Semua":"");
   if(on){tg.MainButton.show();tg.MainButton.enable()}else{tg.MainButton.hide()}
 }
 if(on)renderList();else render();
}
function renderList(){
 const list=$("list"); if(!list)return;
 list.innerHTML="";
 params.forEach((p,j)=>{
   const row=document.createElement("div");row.className="row";
   const v=num(j);
   row.innerHTML='<div class="name"><b>'+(j+1)+". "+p.label+'</b><span>'+p.satuan+'</span></div>'+
     '<div class="val">'+(v===null?"-":textValue(j))+'</div>'+
     '<div class="badge '+(v===null?"missing":"ready")+'">'+(v===null?"KOSONG":"SIAP")+'</div>';
   row.onclick=()=>{i=j;showReview(false)};
   list.appendChild(row);
 });
}
function finish(){
 for(let j=0;j<params.length;j++){
   if(num(j)===null){i=j;showReview(false);h("rigid");return}
 }
 const values={};params.forEach((p,j)=>values[p.key]=String(num(j)));
 h("medium");
 if(tg?.sendData)tg.sendData(JSON.stringify({action:"submit",values}));
 else alert("Preview browser: data valid dan siap dikirim melalui Telegram.");
}
$("cancel").onclick=()=>{if(tg?.sendData)tg.sendData(JSON.stringify({action:"cancel"}));else history.back()};
$("reviewBtn").onclick=()=>showReview(!review);
prev.onclick=goBack;
nextBtn.onclick=goNext;
document.querySelectorAll(".key").forEach(b=>b.onclick=()=>{
 const k=b.dataset.k;
 if(k==="back"){vals[i]=vals[i].slice(0,-1);if(!vals[i])neg[i]=false}
 else if(k==="dot"){if(!vals[i].includes(".")){vals[i]=vals[i]||"0";vals[i]+="."}}
 else if(k==="sign"){if(vals[i])neg[i]=!neg[i]}
 else if(vals[i].length<10){vals[i]=vals[i]==="0"?k:vals[i]+k}
 h();render();
});
tg?.MainButton?.onClick(()=>review?finish():goNext());
tg?.BackButton?.onClick(goBack);
window.addEventListener("keydown",e=>{
 if(e.key==="Enter"){e.preventDefault();review?finish():goNext()}
 else if(e.key==="Backspace"){e.preventDefault();vals[i]=vals[i].slice(0,-1);render()}
 else if(/^\d$/.test(e.key)){vals[i]=(vals[i]==="0"?e.key:vals[i]+e.key).slice(0,10);render()}
 else if(e.key==="."||e.key===","){if(!vals[i].includes(".")){vals[i]=vals[i]||"0";vals[i]+="."}render()}
 else if(e.key==="-"){neg[i]=!neg[i];render()}
});
render();showReview(false);
})();
</script>
</body>
</html>
