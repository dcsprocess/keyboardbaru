<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03-minimal-operator.html</title><style>
:root{--bg:#fff;--card:#f2f2f7;--text:#111;--hint:#777;--blue:#2481cc;--green:#22a06b;--red:#d93025}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;color:var(--text)}
.app{width:min(390px,100vw);height:844px;margin:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.head{display:grid;grid-template-columns:82px 1fr 82px;align-items:center;gap:8px}.head button{border:0;background:none;color:var(--blue);font-weight:700;padding:8px 2px}.head .cancel{color:var(--red)}
.title{text-align:center;font-size:15px;font-weight:800}.sub{text-align:center;font-size:11px;color:var(--hint);margin-top:2px}
.progress{height:6px;background:var(--card);border-radius:99px}.progress i{display:block;width:43%;height:100%;background:var(--blue);border-radius:99px}
.meta{background:var(--card);border-radius:15px;padding:9px 11px;font-size:11px;color:var(--hint);display:flex;gap:8px;flex-wrap:wrap}.meta b{color:var(--text)}
.card{background:var(--card);border-radius:18px;padding:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}.param-left{min-width:0}.label{font-size:18px;font-weight:800;line-height:1.2}.unit,.std{font-size:11px;color:var(--hint);margin-top:4px}.param-right{text-align:right;border-left:1px solid rgba(128,128,128,.18);padding-left:12px;min-width:82px}.operator{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}.shift{font-size:11px;color:var(--hint);margin-top:3px}
.display{height:72px;background:var(--card);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;flex:1;min-height:0}.key{border:0;border-radius:18px;background:var(--card);font-size:29px;font-weight:650;box-shadow:0 1px 2px #0001;min-height:58px}.key.wide{grid-column:span 3;font-size:18px}.footer{display:flex;gap:10px}.footer button{height:48px;border:0;border-radius:15px;font-weight:800;font-size:15px}.back{flex:1;background:var(--card);color:var(--text)}.next{flex:1.6;background:var(--blue);color:white}
.review{display:none;flex:1;min-height:0;overflow:auto}.review.show{display:block}.list{background:var(--card);border-radius:16px;padding:0 12px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.18)}.row:last-child{border:0}.name{min-width:0}.name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.name span{font-size:10px;color:var(--hint)}.val{font-weight:800}.badge{font-size:10px;font-weight:800;min-width:45px;text-align:right}.ready{color:var(--green)}.missing{color:var(--red)}</style></head><body>
<div class="app">
<div class="head"><button class="cancel">Batal</button><div><div class="title">4 / 9</div><div class="sub">Input Parameter</div></div><button>Review</button></div>
<div class="progress"><i></i></div>
<div class="card">
  <div class="param-left">
    <div class="label">Suhu Carb Liquor</div>
    <div class="unit">°C · Standar 75 – 85</div>
  </div>
  <div class="param-right">
    <div class="operator" id="operator">-</div>
    <div class="shift" id="shift">-</div>
  </div>
</div>
<div class="display">82.5</div>
<section id="entry"><div class="keys">
<button class="key">7</button><button class="key">8</button><button class="key">9</button>
<button class="key">4</button><button class="key">5</button><button class="key">6</button>
<button class="key">1</button><button class="key">2</button><button class="key">3</button>
<button class="key">±</button><button class="key">0</button><button class="key">,</button>
<button class="key wide">⌫ Hapus</button></div></section>
<div class="footer"><button class="back">← Kembali</button><button class="next">Lanjut →</button></div>
</div><section id="review" class="review"><div class="list" id="list"></div></section></body></html>
