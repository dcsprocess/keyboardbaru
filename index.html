<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="operator-ui-version" content="v-final-dynamic-responsive-2">
<title>Operator Input</title>
<script src="https://telegram.org/js/telegram-web-app.js">clearBtn?.addEventListener("contextmenu",e=>e.preventDefault());
</script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --card:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#777);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btntext:var(--tg-theme-button-text-color,#fff);
  --ok:#22a06b;--warn:#e67e00;--bad:#d93025;--bad-tint:rgba(217,48,37,.10);

  /* Skala dinamis: menyesuaikan tinggi viewport perangkat (HP pendek, HP tinggi, tablet)
     sambil menjaga target sentuh tetap nyaman (>=44px). */
  --gap-section:clamp(10px, 2.0dvh, 18px);
  --gap-key:clamp(8px, 1.6dvh, 14px);
  --key-h:clamp(48px, 7.4dvh, 64px);
  --display-h:clamp(56px, 8dvh, 70px);
  --card-h:clamp(78px, 11dvh, 92px);
  --nav-h:clamp(44px, 6dvh, 50px);
  --radius-lg:clamp(16px, 2.8vw, 20px);
  --radius-md:clamp(13px, 2.2vw, 18px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;min-height:100%;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{overflow-x:hidden;overflow-y:auto}
button{font:inherit}
.app{
  width:100%;max-width:520px;margin:0 auto;
  min-height:100dvh;
  padding:clamp(6px,1.2dvh,12px) 14px calc(clamp(8px,1.5dvh,16px) + env(safe-area-inset-bottom));
}
.head{
  display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;column-gap:8px;
  min-height:46px;
}
.head button{
  border:0;background:transparent;color:var(--btn);
  font-size:14px;font-weight:800;padding:8px 3px;
}
.head .cancel{visibility:hidden}
.title{text-align:center;font-weight:850;font-size:16px;line-height:19px}
.sub{text-align:center;color:var(--hint);font-size:11px;margin-top:2px}
.progress{
  height:4px;background:var(--card);border-radius:99px;
  overflow:hidden;margin:clamp(3px,.7dvh,6px) 0 clamp(7px,1.4dvh,12px);
}
.progress>i{
  display:block;height:100%;width:0;background:var(--btn);transition:width .2s;
}
.meta{
  display:flex;flex-wrap:wrap;gap:4px 10px;
  background:var(--card);border-radius:14px;
  padding:8px 11px;margin-bottom:clamp(7px,1.4dvh,12px);
  font-size:10px;color:var(--hint);
}
.meta b{color:var(--text)}

#entry{display:flex;flex-direction:column;gap:0}
#entry>*{margin-bottom:var(--gap-section)}
#entry>.note{margin-bottom:4px}
#entry>.nav-buttons{margin-bottom:0}

.parameter-card{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  height:var(--card-h);min-height:var(--card-h);
  padding:12px 14px;
  background:var(--card);
  border-radius:var(--radius-lg);
  box-shadow:0 0 0 1px rgba(128,128,128,.04);
}
.param-main{min-width:0}
.label{font-size:17px;font-weight:850;line-height:1.18;overflow-wrap:anywhere}
.unit{font-size:10px;color:var(--hint);margin-top:4px}
.std{font-size:10px;margin-top:5px}
.state{font-size:11px;font-weight:800;min-height:13px;margin-top:3px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}

.param-person{
  min-width:86px;max-width:132px;
  padding-left:13px;margin-left:10px;
  border-left:1px solid rgba(128,128,128,.20);
  text-align:right;
}
.operator-name{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.operator-shift{margin-top:3px;font-size:10px;color:var(--hint);white-space:nowrap}

.display{
  width:100%;height:var(--display-h);min-height:var(--display-h);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border-radius:var(--radius-lg);
  box-shadow:0 0 0 1px rgba(128,128,128,.04);
  font-size:clamp(30px,8vw,38px);font-weight:850;letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
}
.empty{color:var(--hint);font-weight:500}

/* ===== Keypad ===== */
.keys{
  width:100%;display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(5,var(--key-h));
  row-gap:var(--gap-key);
  column-gap:clamp(8px,2vw,12px);
}
.key{
  width:100%;height:100%;
  border:0;border-radius:var(--radius-md);
  background:var(--card);color:var(--text);
  font-size:clamp(20px,6.2vw,26px);font-weight:700;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;-webkit-touch-callout:none;user-select:none;
  box-shadow:0 1.5px 0 rgba(128,128,128,.16);
  transition:transform .08s ease,box-shadow .08s ease,filter .08s ease;
}
.key:active{
  transform:translateY(1px) scale(.97);
  filter:brightness(.92);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.20);
}
.key:focus-visible{outline:2px solid var(--btn);outline-offset:2px}

/* Baris fungsi/simbol memakai teks lebih kecil agar tidak berdesakan */
.key[data-k="sign"],
.key[data-k="dot"]{font-size:clamp(16px,4.4vw,19px);font-weight:800}

/* Baris aksi terakhir: Hapus (2 kolom, aksi paling sering dipakai)
   dan Hapus Semua (1 kolom, ditandai warna agar tidak tersentuh tanpa sengaja) */
.key[data-k="back"]{
  grid-column:span 2;
  font-size:clamp(15px,3.8vw,17px);font-weight:800;
  gap:6px;
}
.key[data-k="clear"]{grid-column:span 2;grid-row:5;color:var(--bad);background:var(--bad-tint);font-size:0;isolation:isolate}
/* ===== /Keypad ===== */

.draft-status{min-height:13px;text-align:center;color:var(--hint);font-size:10px;line-height:13px}
.draft-status.saved{color:var(--ok)}
.note{min-height:13px;height:13px;text-align:center;color:var(--hint);font-size:10px;line-height:13px}

.nav-buttons{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(8px,1.8vw,12px)}
.nav-btn{height:var(--nav-h);min-height:var(--nav-h);border:0;border-radius:15px;font-size:14px;font-weight:850;touch-action:manipulation}
.nav-btn.prev{background:var(--card);color:var(--text)}
.nav-btn.next{background:var(--btn);color:var(--btntext)}
.nav-btn:disabled{opacity:.42}
.nav-btn:active{transform:scale(.98)}

.review{display:none;min-height:0;overflow:visible;padding-top:8px}
.review.show{display:block}
.list{background:var(--card);border-radius:16px;padding:0 12px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.18)}
.row:last-child{border:0}
.name{min-width:0}.name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.name span{font-size:10px;color:var(--hint)}
.val{font-weight:850}
.badge{font-size:10px;font-weight:850;min-width:45px;text-align:right}
.ready{color:var(--ok)}.check{color:var(--warn)}.missing{color:var(--bad)}

/* Layar sangat sempit (HP kecil / mode terlipat) */
@media(max-width:340px){
  :root{--gap-key:6px;--radius-md:12px}
  .key{font-size:clamp(18px,7vw,22px)}
  .key[data-k="back"]{font-size:13px}
  .key[data-k="clear"]{font-size:10px}
}

/* Layar lebar (tablet) — batasi lebar keypad agar tombol tidak jadi terlalu besar/jauh dari ibu jari */
@media(min-width:600px){
  .app{padding-left:18px;padding-right:18px;max-width:560px}
}

/* Viewport pendek (HP dalam split-screen, browser bar besar, dsb.) */
@media(max-height:620px){
  :root{
    --gap-section:9px;--gap-key:6px;
    --key-h:44px;--display-h:52px;--card-h:74px;--nav-h:42px;
  }
}

/* Viewport tinggi (tablet/desktop) — tombol boleh lebih besar dan lega */
@media(min-height:900px){
  :root{
    --gap-section:18px;--gap-key:13px;
    --key-h:64px;--display-h:72px;--card-h:94px;--nav-h:50px;
  }
}

/* Landscape di HP: ruang vertikal sempit, keypad tetap harus muat tanpa scroll */
@media(orientation:landscape) and (max-height:500px){
  .app{max-width:720px}
  :root{
    --gap-section:8px;--gap-key:6px;
    --key-h:40px;--display-h:46px;--card-h:64px;--nav-h:38px;
  }
  .keys{max-width:360px;margin-inline:auto}
}

/* Perangkat tanpa hover kasar (mouse) mendapat efek hover halus, disembunyikan di layar sentuh */
@media(hover:hover) and (pointer:fine){
  .key:hover{
    filter:brightness(.95);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.12);
    transform:translateY(.5px);
  }
  .key:hover:active{
    filter:brightness(.90);
    box-shadow:inset 0 2px 5px rgba(0,0,0,.22);
    transform:translateY(1px) scale(.97);
  }
  .nav-btn:not(:disabled):hover{filter:brightness(0.97)}
}

@media(prefers-reduced-motion:reduce){
  .key,.nav-btn{transition:none}
  .key:active,.nav-btn:active{transform:none}
}

/* OPERATOR FLOW V4 — agreed mockup */
.app{max-width:500px;padding:6px 12px calc(9px + env(safe-area-inset-bottom))}
.head{grid-template-columns:40px 1fr 40px;min-height:40px}.head button{width:40px;height:40px;padding:0;font-size:22px}.head #reviewBtn{width:40px;height:40px;display:block}
.title{font-size:15px;font-weight:900}.sub{font-size:11px;font-weight:800}
.meta{justify-content:center;padding:5px 8px;margin-bottom:5px;font-size:9px;max-height:30px}
.flow-progress{display:flex;gap:4px;margin:0 2px 7px;min-height:7px}.flow-progress i{flex:1;height:5px;border-radius:99px;background:var(--card)}.flow-progress i.done{background:var(--ok)}.flow-progress i.current{background:var(--btn);transform:scaleY(1.35)}
#entry{display:flex;flex-direction:column;gap:clamp(7px,1.35dvh,11px)}
.parameter-card{height:clamp(78px,10.4dvh,88px);min-height:clamp(78px,10.4dvh,88px);display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);border-radius:18px;padding:10px 14px}
.param-main{width:100%}.label{font-size:clamp(16px,4.7vw,20px);font-weight:900;text-transform:uppercase}.std{font-size:10px;margin-top:4px}.unit{font-size:9px;color:var(--hint);margin-top:2px}.state{font-size:11px;font-weight:850;min-height:13px;margin-top:3px}
.display{height:clamp(55px,7.3dvh,65px);min-height:clamp(55px,7.3dvh,65px);border-radius:18px;font-size:clamp(30px,8.3vw,39px);font-weight:900}
.keys{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,clamp(46px,7.1dvh,60px));gap:clamp(6px,1.15dvh,10px) clamp(7px,1.8vw,11px)}
.key{border-radius:15px;font-size:clamp(20px,6.1vw,26px);font-weight:750;position:relative;overflow:hidden}.key[data-k="sign"],.key[data-k="dot"]{font-size:18px}
.key[data-k="clear"]{grid-column:span 2;grid-row:5;color:var(--bad);background:var(--bad-tint);font-size:0}
.key[data-k="back"]{grid-column:3;grid-row:5;font-size:0}.key[data-k="back"]::before{content:"⌫";font-size:25px}
.clear-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:25px;position:relative;z-index:4;pointer-events:none}

.draft-status{height:10px;min-height:10px;text-align:center;font-size:9px}.nav-buttons{grid-template-columns:1fr}.nav-btn.next{height:48px;min-height:48px;border-radius:14px;font-weight:900}.nav-btn.prev{display:none}
@media(max-height:620px){.parameter-card{height:68px;min-height:68px}.display{height:50px;min-height:50px}.keys{grid-template-rows:repeat(5,42px)}.nav-btn.next{height:44px;min-height:44px}}


/* V5 FULL-BUTTON HOLD PROGRESS */
.key[data-k="clear"]{position:relative;overflow:hidden}
.hold-fill{
 position:absolute;inset:0;width:100%;height:100%;z-index:1;
 background:var(--bad);opacity:.16;
 transform:scaleX(0);transform-origin:left center;
 pointer-events:none;will-change:transform;
}
.key[data-k="clear"].arming .hold-fill,
.key[data-k="clear"].armed .hold-fill{transform:scaleX(var(--hold-scale,0))}
.key[data-k="clear"].armed .hold-fill{opacity:.24}


/* V6 — clean operator header: no summary/menu icon on entry */
#entry ~ * #reviewBtn{visibility:hidden}
.head #reviewBtn{visibility:hidden;pointer-events:none}
.head{position:relative}
.head .title{padding-inline:8px}


/* V7 — BACK + NEXT */
.nav-buttons{display:grid!important;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr)!important;gap:8px}
.nav-btn.prev{display:flex!important;height:48px;min-height:48px;align-items:center;justify-content:center;border-radius:14px;font-size:24px;font-weight:900}
.nav-btn.next{height:48px;min-height:48px}
.nav-btn.prev:disabled{opacity:.28;filter:saturate(.4);pointer-events:none}
@media(max-height:620px){.nav-btn.prev{height:44px;min-height:44px}.nav-btn.next{height:44px;min-height:44px}}


/* V8 — balanced navigation */
.nav-buttons{
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:8px;
}
.nav-btn.prev,
.nav-btn.next{
  width:100%;
  height:48px;
  min-height:48px;
}
@media(max-height:620px){
  .nav-btn.prev,.nav-btn.next{
    height:44px;
    min-height:44px;
  }
}


/* V9 — icon-only next */
.nav-btn.prev,
.nav-btn.next{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
}
.nav-btn.prev{font-size:25px}


/* V10 — optical centering for navigation icons */
.nav-btn.prev,.nav-btn.next{
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  padding:0!important;
  line-height:1!important;
  text-align:center!important;
}
.nav-btn .nav-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:1em;
  height:1em;
  line-height:1;
  font-size:26px;
  font-weight:900;
  transform:translateY(-1px);
  pointer-events:none;
}
.nav-btn.prev .nav-icon{transform:translate(-1px,-1px)}
.nav-btn.next .nav-icon{transform:translate(1px,-1px)}


/* V11 — bottom full-width CANCEL with 800ms hold */
.cancel-bottom{
  position:relative;
  width:100%;
  height:44px;
  min-height:44px;
  margin-top:2px;
  border:0;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  background:var(--bad-tint);
  color:var(--bad);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.cancel-fill{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  background:var(--bad);
  opacity:.16;
  transform:scaleX(0);
  transform-origin:left center;
  pointer-events:none;
  will-change:transform;
}
.cancel-bottom.arming .cancel-fill,
.cancel-bottom.armed .cancel-fill{transform:scaleX(var(--cancel-scale,0))}
.cancel-bottom.armed .cancel-fill{opacity:.24}
.cancel-icon{
  position:relative;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:center;
  width:1em;
  height:1em;
  font-size:23px;
  line-height:1;
  font-weight:900;
  pointer-events:none;
}
.head .cancel{visibility:hidden;pointer-events:none}
@media(max-height:620px){
  .cancel-bottom{height:40px;min-height:40px}
}

</style>
</head>
<body>
<div class="app">
  <div class="head"><span class="cancel" id="cancel" aria-hidden="true"></span>
<div><div class="title" id="title">LAPORAN SHIFT</div><div class="sub" id="sub">1 / 1</div></div>
<span id="reviewBtn" aria-hidden="true"></span></div>
<div class="progress"><i id="bar"></i></div><div class="meta" id="meta"></div>
<div id="flowProgress" class="flow-progress"></div>

  <section id="entry">
<div class="parameter-card"><div class="param-main">
<div class="label" id="label">CO₂ CONTENT</div>
<div class="std" id="std"></div><div class="unit" id="unit"></div><div class="state" id="state"></div>
</div></div>
<div class="display empty" id="display">0</div>
<div class="keys">
<button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
<button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
<button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
<button class="key" data-k="sign">±</button><button class="key" data-k="0">0</button><button class="key" data-k="dot">,</button>
<button class="key" data-k="clear" aria-label="Tekan dan tahan 0,8 detik untuk hapus semua"><span class="hold-fill" aria-hidden="true"></span><span class="clear-icon">↺</span></button>
<button class="key" data-k="back" aria-label="Hapus satu digit terakhir">⌫</button>
</div>
<div class="draft-status" id="draftStatus"></div>
<div class="nav-buttons"><button type="button" class="nav-btn prev" id="prevBtn" aria-label="Kembali"><span class="nav-icon" aria-hidden="true">←</span></button><button type="button" class="nav-btn next" id="nextBtn" aria-label="Lanjut"><span class="nav-icon" aria-hidden="true">→</span></button></div>
<button type="button" class="cancel-bottom" id="cancelBottom" aria-label="Batal pengisian">
  <span class="cancel-fill" aria-hidden="true"></span>
  <span class="cancel-icon" aria-hidden="true">×</span>
</button>
</section>
<section class="review" id="review"><div class="flow-review-head"><b id="reviewCount">0 / 0</b><span> siap diperiksa</span></div><div class="list" id="list"></div></section>
</div>
<script>
(()=>{"use strict";
// iOS Safari/WKWebView tidak akan menerapkan :active saat tap kecuali ada listener
// touch terpasang di dokumen — tanpa ini efek "ditekan" di CSS tidak pernah muncul di HP.
document.addEventListener("touchstart",()=>{},{passive:true});
const tg=window.Telegram?.WebApp||null, qs=new URLSearchParams(location.search);
const parse=(s,f)=>{try{return JSON.parse(s||"")||f}catch(e){return f}};
let params=parse(qs.get("params"),[]), meta=parse(qs.get("meta"),{});
params=Array.isArray(params)?params.map(p=>({key:String(p.key||""),label:String(p.label||p.key||"Nilai"),satuan:String(p.satuan||""),stdMin:p.stdMin??p.min??null,stdMax:p.stdMax??p.max??null,stdText:String(p.stdText||p.std||"")})).filter(p=>p.key):[];
if(!params.length)params=[{key:"nilai",label:"Nilai",satuan:""}];
let i=0, vals=params.map(()=>""), neg=params.map(()=>false), review=false;
const $=x=>document.getElementById(x), display=$("display"), label=$("label"), unit=$("unit"), std=$("std"), state=$("state");
const operatorName=$("operatorName"), operatorShift=$("operatorShift"), prevBtn=$("prevBtn"), nextBtn=$("nextBtn");
if(operatorName)operatorName.textContent=meta.nama_operator||meta.operator||"-";
if(operatorShift)operatorShift.textContent=meta.shift?("Shift "+String(meta.shift).replace(/^Shift\s*/i,"")):"Shift -";
if(tg){tg.ready();tg.expand()}
function h(t){try{tg?.HapticFeedback?.impactOccurred(t||"light")}catch(e){}}
const draftStatus=$("draftStatus");
const draftKey=(()=>{
 const stable={params:params.map(p=>p.key),tanggal:meta.tanggal||"",jam:meta.jam||"",shift:meta.shift||"",grup:meta.grup||"",operator:meta.nama_operator||meta.operator||""};
 let s="operatorDraft:v2:"+JSON.stringify(stable),h=0;for(let k=0;k<s.length;k++)h=((h<<5)-h+s.charCodeAt(k))|0;
 return "operatorDraft:v2:"+Math.abs(h);
})();
function saveDraft(){
 try{localStorage.setItem(draftKey,JSON.stringify({vals,neg,i,ts:Date.now()}));
 if(draftStatus){draftStatus.className="draft-status saved";draftStatus.textContent="✓ Draft tersimpan otomatis"}}catch(e){}
}
function restoreDraft(){
 try{const d=JSON.parse(localStorage.getItem(draftKey)||"null");
 if(!d||!Array.isArray(d.vals)||d.vals.length!==params.length||!d.vals.some(v=>String(v||"").length))return;
 for(let j=0;j<params.length;j++){vals[j]=String(d.vals[j]||"");neg[j]=!!(d.neg&&d.neg[j])}
 if(Number.isInteger(d.i))i=Math.max(0,Math.min(params.length-1,d.i));
 if(draftStatus){draftStatus.className="draft-status saved";draftStatus.textContent="↻ Draft terakhir dipulihkan"}
 }catch(e){}
}
function clearDraft(){try{localStorage.removeItem(draftKey)}catch(e){}}
function raw(j=i){return (neg[j]?"-":"")+vals[j]}
function num(j=i){if(!vals[j])return null;const n=parseFloat(raw(j));return Number.isFinite(n)?n:null}
function renderMeta(){const keys=[["tanggal","Tanggal"],["jam","Jam"],["shift","Shift"],["grup","Grup"],["nama_operator","Operator"],["supervisor","SPV"],["shift_chief","Shift Chief"]];$("meta").innerHTML=keys.filter(x=>meta[x[0]]).map(x=>"<span>"+x[1]+": <b>"+String(meta[x[0]])+"</b></span>").join("")}
function render(){const backBtn=$("prevBtn");if(backBtn){backBtn.disabled=(i===0);backBtn.setAttribute("aria-disabled",i===0?"true":"false");}
 if(review)return;
 const p=params[i], n=num(); label.textContent=p.label;unit.textContent=p.satuan?"Satuan: "+p.satuan:"";
 $("sub").textContent=(i+1)+" / "+params.length;$("bar").style.width=((i+1)/params.length*100)+"%";
 display.textContent=vals[i]?raw():"0";display.classList.toggle("empty",!vals[i]);
 std.textContent=p.stdText||((p.stdMin!=null&&p.stdMax!=null)?("Standar: "+p.stdMin+" – "+p.stdMax+(p.satuan?" "+p.satuan:"")):"");
state.textContent="";state.className="state";const fp=$("flowProgress");if(fp)fp.innerHTML=params.map((_,j)=>'<i class="'+(j<i?"done":j===i?"current":"")+'"></i>').join("");
if(n!==null&&p.stdMin!=null&&p.stdMax!=null){const lo=Number(p.stdMin),hi=Number(p.stdMax);if(Number.isFinite(lo)&&Number.isFinite(hi)){if(n<lo||n>hi){state.className="state warn";state.textContent="⚠ Di luar standar — tetap bisa disimpan"}else{state.className="state ok";state.textContent="✓ NORMAL"}}}
 $("note").textContent="";
if(prevBtn){prevBtn.disabled=i===0;}
if(nextBtn){nextBtn.textContent=i===params.length-1?"Review & Kirim":"Lanjut ›";}
}
function next(){if(num()===null){state.className="state bad";state.textContent="❌ Nilai belum diisi";h("rigid");return}if(i<params.length-1){i++;saveDraft();render()}else{saveDraft();showReview(true)}}
function back(){if(review){showReview(false);return}if(i){i--;render()}}
function showReview(on){review=on;$("entry").style.display=on?"none":"block";$("review").classList.toggle("show",on);$("title").textContent=on?"Periksa Laporan":"Input Operator";$("reviewBtn").textContent=on?"✏️ Edit":"📋 Ringkas";
if(on){renderList();tg?.MainButton?.setText("✅ Kirim Semua");tg?.MainButton?.show();tg?.MainButton?.enable()}else{tg?.MainButton?.hide();render()}}
function renderList(){const list=$("list");list.innerHTML="";const rc=$("reviewCount");if(rc)rc.textContent=params.filter((_,j)=>num(j)!==null).length+" / "+params.length;params.forEach((p,j)=>{const n=num(j),r=document.createElement("div");r.className="row";r.innerHTML='<div class="name"><b>'+(j+1)+". "+p.label+'</b><span>'+p.satuan+'</span></div><div class="val">'+(n===null?"-":n)+'</div><div class="badge '+(n===null?"missing":"ready")+'">'+(n===null?"KOSONG":"SIAP")+"</div>";r.onclick=()=>{i=j;showReview(false)};list.appendChild(r)})}
function finish(){for(let j=0;j<params.length;j++)if(num(j)===null){i=j;showReview(false);h("rigid");return}const values={};params.forEach((p,j)=>values[p.key]=String(num(j)));clearDraft();h("medium");tg?.sendData(JSON.stringify({action:"submit",values}))}
$("cancel").onclick=()=>tg?.sendData(JSON.stringify({action:"cancel"}));
$("reviewBtn").onclick=()=>showReview(!review);
prevBtn?.addEventListener("click",back);
nextBtn?.addEventListener("click",next);
const clearBtn=document.querySelector('.key[data-k="clear"]');
let clearTimer=null,clearRaf=null,clearStart=0,clearArmed=false;
function clearReset(){
  if(clearTimer){clearTimeout(clearTimer);clearTimer=null}
  if(clearRaf){cancelAnimationFrame(clearRaf);clearRaf=null}
  if(clearBtn){
    clearBtn.classList.remove("arming","armed");
    clearBtn.style.setProperty("--hold-scale","0");
    clearBtn.setAttribute("aria-busy","false");
  }
  clearArmed=false;
}
function clearAnimate(){
  if(!clearBtn||!clearBtn.classList.contains("arming"))return;
  const progress=Math.min(1,(performance.now()-clearStart)/800);
  clearBtn.style.setProperty("--hold-scale",progress.toFixed(4));
  if(progress<1)clearRaf=requestAnimationFrame(clearAnimate);
}
function clearBegin(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();
  clearReset();
  clearStart=performance.now();
  clearBtn.classList.add("arming");
  clearBtn.setAttribute("aria-busy","true");
  clearBtn.style.setProperty("--hold-scale","0");
  try{clearBtn.setPointerCapture(e.pointerId)}catch(_){}
  clearRaf=requestAnimationFrame(clearAnimate);
  clearTimer=setTimeout(()=>{
    vals[i]="";
    neg[i]=false;
    clearArmed=true;
    clearBtn.classList.add("armed");
    clearBtn.style.setProperty("--hold-scale","1");
    h("light");
    saveDraft();
    render();
    setTimeout(clearReset,180);
  },800);
}
function clearEnd(e){
  try{if(clearBtn.hasPointerCapture?.(e.pointerId))clearBtn.releasePointerCapture(e.pointerId)}catch(_){}
  if(!clearArmed)clearReset();
}
clearBtn?.addEventListener("pointerdown",clearBegin);
clearBtn?.addEventListener("pointerup",clearEnd);
clearBtn?.addEventListener("pointercancel",clearEnd);
clearBtn?.addEventListener("lostpointercapture",()=>{if(!clearArmed)clearReset()});
document.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="back"){vals[i]=vals[i].slice(0,-1);if(!vals[i])neg[i]=false}else if(k==="clear"){}else if(k==="dot"){if(!vals[i].includes("."))vals[i]=vals[i]||"0",vals[i]+="."}else if(k==="sign"){if(vals[i])neg[i]=!neg[i]}else if(vals[i].length<10){vals[i]=vals[i]==="0"?k:vals[i]+k}h();saveDraft();render()});
tg?.MainButton?.onClick(()=>{if(review)finish();});tg?.BackButton?.onClick(back);
window.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();review?finish():next()}else if(e.key==="Backspace"){e.preventDefault();vals[i]=vals[i].slice(0,-1);if(!vals[i])neg[i]=false;saveDraft();render()}else if(/^\d$/.test(e.key)){vals[i]=(vals[i]==="0"?e.key:vals[i]+e.key).slice(0,10);saveDraft();render()}else if(e.key==="."||e.key===","){if(!vals[i].includes("."))vals[i]=vals[i]||"0",vals[i]+=".";saveDraft();render()}else if(e.key==="-"){neg[i]=!neg[i];saveDraft();render()}});
renderMeta();tg?.MainButton?.hide();
restoreDraft();
render();showReview(false);
})();

$("prevBtn")?.addEventListener("click",()=>{
  if(i<=0)return;
  i--;
  render();
  h("light");
});

const cancelBottom=document.querySelector('#cancelBottom');
let cancelTimer=null,cancelRaf=null,cancelStart=0,cancelArmed=false;
function cancelReset(){
  if(cancelTimer){clearTimeout(cancelTimer);cancelTimer=null}
  if(cancelRaf){cancelAnimationFrame(cancelRaf);cancelRaf=null}
  if(cancelBottom){
    cancelBottom.classList.remove("arming","armed");
    cancelBottom.style.setProperty("--cancel-scale","0");
    cancelBottom.setAttribute("aria-busy","false");
  }
  cancelArmed=false;
}
function cancelAnimate(){
  if(!cancelBottom||!cancelBottom.classList.contains("arming"))return;
  const progress=Math.min(1,(performance.now()-cancelStart)/800);
  cancelBottom.style.setProperty("--cancel-scale",progress.toFixed(4));
  if(progress<1)cancelRaf=requestAnimationFrame(cancelAnimate);
}
function cancelBegin(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();
  cancelReset();
  cancelStart=performance.now();
  cancelBottom.classList.add("arming");
  cancelBottom.setAttribute("aria-busy","true");
  cancelBottom.style.setProperty("--cancel-scale","0");
  try{cancelBottom.setPointerCapture(e.pointerId)}catch(_){}
  cancelRaf=requestAnimationFrame(cancelAnimate);
  cancelTimer=setTimeout(()=>{
    cancelArmed=true;
    cancelBottom.classList.add("armed");
    cancelBottom.style.setProperty("--cancel-scale","1");
    h("light");
    setTimeout(()=>{
      try{
        if(typeof resetDraft==="function") resetDraft();
      }catch(_){}
      try{
        if(typeof closeApp==="function") closeApp();
        else if(window.Telegram?.WebApp?.close) window.Telegram.WebApp.close();
        else if(typeof cancel==="function") cancel();
      }catch(_){}
      cancelReset();
    },120);
  },800);
}
function cancelEnd(e){
  try{if(cancelBottom.hasPointerCapture?.(e.pointerId))cancelBottom.releasePointerCapture(e.pointerId)}catch(_){}
  if(!cancelArmed)cancelReset();
}
cancelBottom?.addEventListener("pointerdown",cancelBegin);
cancelBottom?.addEventListener("pointerup",cancelEnd);
cancelBottom?.addEventListener("pointercancel",cancelEnd);
cancelBottom?.addEventListener("lostpointercapture",()=>{if(!cancelArmed)cancelReset()});
cancelBottom?.addEventListener("contextmenu",e=>e.preventDefault());
</script>
