<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Operator Input</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--card:var(--tg-theme-secondary-bg-color,#f2f2f7);--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--btn:var(--tg-theme-button-color,#2481cc);--btntext:var(--tg-theme-button-text-color,#fff);--ok:#22a06b;--warn:#e67e00;--bad:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:8px}
.head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.head button{border:0;background:none;color:var(--btn);font-weight:700;padding:7px 4px}.head .cancel{color:var(--bad)}
.title{text-align:center;font-weight:800;font-size:15px}.sub{text-align:center;color:var(--hint);font-size:11px;margin-top:2px}
.progress{height:5px;background:var(--card);border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:var(--btn);transition:.2s}
.meta{background:var(--card);border-radius:14px;padding:9px 11px;font-size:11px;color:var(--hint);display:flex;flex-wrap:wrap;gap:5px 10px}.meta b{color:var(--text)}
.card{background:var(--card);border-radius:17px;padding:12px 14px}.label{font-size:18px;font-weight:800}.unit{font-size:11px;color:var(--hint);margin-top:3px}.std{font-size:11px;margin-top:8px}.state{font-size:12px;font-weight:700;min-height:16px;margin-top:4px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.display{height:70px;background:var(--card);border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;letter-spacing:.5px}.empty{color:var(--hint);font-weight:500}
.keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:8px}.key{border:0;border-radius:15px;background:var(--card);color:var(--text);font-size:28px;font-weight:650}.key:active{transform:scale(.96);opacity:.75}.key.small{font-size:18px}.key.wide{grid-column:span 3}
.note{text-align:center;color:var(--hint);font-size:10px;min-height:14px}
.review{display:none;flex:1;min-height:0;overflow:auto}.review.show{display:block}.list{background:var(--card);border-radius:16px;padding:0 12px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.18)}.row:last-child{border:0}.name{min-width:0}.name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.name span{font-size:10px;color:var(--hint)}.val{font-weight:800}.badge{font-size:10px;font-weight:800;min-width:45px;text-align:right}.ready{color:var(--ok)}.check{color:var(--warn)}.missing{color:var(--bad)}
.parameter-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:13px 15px}
.param-main{min-width:0}
.param-person{text-align:right;border-left:1px solid rgba(128,128,128,.18);padding-left:13px;min-width:78px;max-width:145px}
.operator-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.operator-shift{font-size:10px;color:var(--hint);margin-top:4px;white-space:nowrap}
.keys{gap:13px}
.key{min-height:58px}
.nav-buttons{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-top:2px}
.nav-btn{height:46px;border:0;border-radius:15px;font-size:14px;font-weight:800}
.nav-btn.prev{background:var(--card);color:var(--text)}
.nav-btn.next{background:var(--btn);color:var(--btntext)}
.nav-btn:active{transform:scale(.98);opacity:.82}
</style>
</head>
<body>
<div class="app">
  <div class="head"><button class="cancel" id="cancel">❌ Batal</button><div><div class="title" id="title">Input Operator</div><div class="sub" id="sub">1 / 1</div></div><button id="reviewBtn">📋 Ringkas</button></div>
  <div class="progress"><i id="bar"></i></div>
  <div class="meta" id="meta"></div>

  <section id="entry">
    <div class="card parameter-card">
  <div class="param-main">
    <div class="label" id="label">Nilai</div>
    <div class="unit" id="unit"></div>
    <div class="std" id="std"></div>
    <div class="state" id="state"></div>
  </div>
  <div class="param-person">
    <div class="operator-name" id="operatorName">-</div>
    <div class="operator-shift" id="operatorShift">Shift -</div>
  </div>
</div>
    <div class="display empty" id="display">0</div>
    <div class="keys">
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key small" data-k="sign">±</button><button class="key" data-k="0">0</button><button class="key small" data-k="dot">,</button>
      <button class="key small wide" data-k="back">⌫ Hapus</button>
    </div>
    <div class="note" id="note"></div>
    <div class="nav-buttons">
      <button type="button" class="nav-btn prev" id="prevBtn">‹ Kembali</button>
      <button type="button" class="nav-btn next" id="nextBtn">Lanjut ›</button>
    </div>
  </section>

  <section class="review" id="review"><div class="list" id="list"></div></section>
</div>
<script>
(()=>{"use strict";
const tg=window.Telegram?.WebApp||null, qs=new URLSearchParams(location.search);
const parse=(s,f)=>{try{return JSON.parse(s||"")||f}catch(e){return f}};
let params=parse(qs.get("params"),[]), meta=parse(qs.get("meta"),{});
params=Array.isArray(params)?params.map(p=>({key:String(p.key||""),label:String(p.label||p.key||"Nilai"),satuan:String(p.satuan||"")})).filter(p=>p.key):[];
if(!params.length)params=[{key:"nilai",label:"Nilai",satuan:""}];
let i=0, vals=params.map(()=>""), neg=params.map(()=>false), review=false;
const $=x=>document.getElementById(x), display=$("display"), label=$("label"), unit=$("unit"), std=$("std"), state=$("state");
const operatorName=$("operatorName"), operatorShift=$("operatorShift"), prevBtn=$("prevBtn"), nextBtn=$("nextBtn");
if(operatorName)operatorName.textContent=meta.nama_operator||meta.operator||"-";
if(operatorShift)operatorShift.textContent=meta.shift?("Shift "+String(meta.shift).replace(/^Shift\s*/i,"")):"Shift -";
if(tg){tg.ready();tg.expand()}
function h(t){try{tg?.HapticFeedback?.impactOccurred(t||"light")}catch(e){}}
function raw(j=i){return (neg[j]?"-":"")+vals[j]}
function num(j=i){if(!vals[j])return null;const n=parseFloat(raw(j));return Number.isFinite(n)?n:null}
function renderMeta(){const keys=[["tanggal","Tanggal"],["jam","Jam"],["shift","Shift"],["grup","Grup"],["nama_operator","Operator"],["supervisor","SPV"],["shift_chief","Shift Chief"]];$("meta").innerHTML=keys.filter(x=>meta[x[0]]).map(x=>"<span>"+x[1]+": <b>"+String(meta[x[0]])+"</b></span>").join("")}
function render(){
 if(review)return;
 const p=params[i], n=num(); label.textContent=p.label;unit.textContent=p.satuan?"Satuan: "+p.satuan:"";
 $("sub").textContent=(i+1)+" / "+params.length;$("bar").style.width=((i+1)/params.length*100)+"%";
 display.textContent=vals[i]?raw():"0";display.classList.toggle("empty",!vals[i]);
 std.textContent="";state.textContent="";state.className="state";
 $("note").textContent=params.length>1?"Isi nilai, lalu tekan Lanjut.":"Isi nilai, lalu Review & Kirim.";
if(prevBtn){prevBtn.disabled=i===0;prevBtn.style.opacity=i===0?".45":"1";}
if(nextBtn)nextBtn.textContent=i===params.length-1?"Review & Kirim":"Lanjut ›";
}
function next(){if(num()===null){state.className="state bad";state.textContent="❌ Nilai belum diisi";h("rigid");return}if(i<params.length-1){i++;render()}else{showReview(true)}}
function back(){if(review){showReview(false);return}if(i){i--;render()}}
function showReview(on){review=on;$("entry").style.display=on?"none":"block";$("review").classList.toggle("show",on);$("title").textContent=on?"Periksa Laporan":"Input Operator";$("reviewBtn").textContent=on?"✏️ Edit":"📋 Ringkas";
if(on){renderList();tg?.MainButton?.setText("✅ Kirim Semua");tg?.MainButton?.show();tg?.MainButton?.enable()}else{tg?.MainButton?.setText(i===params.length-1?"📋 Review & Kirim":"Lanjut ▸");tg?.MainButton?.show();render()}}
function renderList(){const list=$("list");list.innerHTML="";params.forEach((p,j)=>{const n=num(j),r=document.createElement("div");r.className="row";r.innerHTML='<div class="name"><b>'+(j+1)+". "+p.label+'</b><span>'+p.satuan+'</span></div><div class="val">'+(n===null?"-":n)+'</div><div class="badge '+(n===null?"missing":"ready")+'">'+(n===null?"KOSONG":"SIAP")+"</div>";r.onclick=()=>{i=j;showReview(false)};list.appendChild(r)})}
function finish(){for(let j=0;j<params.length;j++)if(num(j)===null){i=j;showReview(false);h("rigid");return}const values={};params.forEach((p,j)=>values[p.key]=String(num(j)));h("medium");tg?.sendData(JSON.stringify({action:"submit",values}))}
$("cancel").onclick=()=>tg?.sendData(JSON.stringify({action:"cancel"}));
$("reviewBtn").onclick=()=>showReview(!review);
prevBtn?.addEventListener("click",back);
nextBtn?.addEventListener("click",next);
document.querySelectorAll(".key").forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==="back"){vals[i]=vals[i].slice(0,-1);if(!vals[i])neg[i]=false}else if(k==="dot"){if(!vals[i].includes("."))vals[i]=vals[i]||"0",vals[i]+="."}else if(k==="sign"){if(vals[i])neg[i]=!neg[i]}else if(vals[i].length<10){vals[i]=vals[i]==="0"?k:vals[i]+k}h();render()});
tg?.MainButton?.onClick(()=>review?finish():next());tg?.BackButton?.onClick(back);
window.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();review?finish():next()}else if(e.key==="Backspace"){e.preventDefault();vals[i]=vals[i].slice(0,-1);render()}else if(/^\d$/.test(e.key)){vals[i]=(vals[i]==="0"?e.key:vals[i]+e.key).slice(0,10);render()}else if(e.key==="."||e.key===","){if(!vals[i].includes("."))vals[i]=vals[i]||"0",vals[i]+=".";render()}else if(e.key==="-"){neg[i]=!neg[i];render()}});
renderMeta();render();showReview(false);
})();
</script>
</body>
</html>
